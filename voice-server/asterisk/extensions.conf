; สายเข้า: ยังไม่รับ
[from-yalecom]
exten => _X.,1,Hangup()
exten => s,1,Hangup()

; สายโทรออกที่รับแล้ว: อัดเสียงทั้งสาย แล้วส่งให้โปรแกรมคุมบทโทร (ARI app "thaolai")
[thaolai-out]
