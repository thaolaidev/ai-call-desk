; สายเข้า: ยังไม่รับ
[from-yalecom]
exten => _X.,1,Hangup()
exten => s,1,Hangup()

; สายโทรออกที่รับแล้ว: อัดเสียงทั้งสาย แล้วส่งให้โปรแกรมคุมบทโทร (ARI app "thaolai")
[thaolai-out]
exten => s,1,NoOp(Thaolai call ${CALL_ID})
; r(...) = ไฟล์เสียงฝั่งเจ้าของอย่างเดียว ใช้ดึงคำตอบที่เจ้าของพูดสวนตอนบอทยังถามไม่จบ
 same => n,MixMonitor(/var/spool/asterisk/recording/full-${CALL_ID}.wav,r(/var/spool/asterisk/recording/rx-${CALL_ID}.wav))
 same => n,Stasis(thaolai,${CALL_ID})
 same => n,Hangup()
