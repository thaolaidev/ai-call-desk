; ===== สายโทรออกผ่าน SIP Trunk ของ Yalecom =====
; ค่าใน ${...} มาจากไฟล์ .env (แทนค่าตอนเปิด container)

[global]
type=global
user_agent=ThaolaiVoice

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:${SIP_LOCAL_PORT}
external_media_address=${PUBLIC_IP}
external_signaling_address=${PUBLIC_IP}

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:${SIP_LOCAL_PORT}
external_media_address=${PUBLIC_IP}
external_signaling_address=${PUBLIC_IP}

; ลงทะเบียนกับ Yalecom (ถ้า Yalecom ใช้แบบอนุญาตตาม IP ไม่ต้องใช้ส่วนนี้ ให้ตั้ง SIP_REGISTER=no)
[yalecom-reg]
type=registration
outbound_auth=yalecom-auth
transport=transport-${SIP_TRANSPORT}
server_uri=sip:${SIP_HOST}:${SIP_PORT};transport=${SIP_TRANSPORT}
client_uri=sip:${SIP_USER}@${SIP_HOST}
contact_user=${SIP_USER}
retry_interval=60
expiration=300

[yalecom-auth]
type=auth
auth_type=userpass
username=${SIP_USER}
password=${SIP_PASS}

[yalecom]
type=aor
contact=sip:${SIP_HOST}:${SIP_PORT};transport=${SIP_TRANSPORT}
qualify_frequency=60

[yalecom]
type=endpoint
transport=transport-${SIP_TRANSPORT}
context=from-yalecom
disallow=all
allow=alaw,ulaw
outbound_auth=yalecom-auth
aors=yalecom
from_user=${SIP_USER}
from_domain=${SIP_HOST}
callerid=${CALLER_ID} <${CALLER_ID}>
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[yalecom]
type=identify
endpoint=yalecom
match=${SIP_HOST}
